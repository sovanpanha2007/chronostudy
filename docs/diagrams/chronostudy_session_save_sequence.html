<h2 class="sr-only">Sequence diagram showing the flow when a user saves a study session, distinguishing feedback that always fires from feedback that only fires conditionally</h2>
<div id="seq"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('seq-svg', `sequenceDiagram
  actor User
  participant UI as Timer UI
  participant DB as Supabase database functions

  Note over UI: Local recovery checkpoints; cloud save every 5 minutes
  User->>UI: Stop and save session
  UI->>UI: Persist final snapshot in user-scoped queue
  UI-->>User: Update total time and heatmap immediately
  UI->>DB: Finalize UUID, revision, confirmed duration
  Note over DB: Validate ownership/revision; save and award badges atomically
  DB-->>UI: Acknowledgement, totals, day, session, badge results
  UI->>UI: Reconcile confirmed server results
  opt Daily goal met
    UI-->>User: Goal complete animation
  end
  opt New badge threshold crossed
    UI-->>User: Badge unlock animation
  end`);
document.getElementById('seq').innerHTML = svg;
</script>
